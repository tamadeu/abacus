<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Ábaco</title>
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <header class="titlebar">
      <div class="logo" aria-hidden="true">Á</div>
      <div>
        <h1>Ábaco</h1>
        <p id="engine-label"></p>
      </div>
    </header>

    <div class="formula-bar">
      <div id="name-box" aria-label="Célula selecionada">A1</div>
      <label for="fx">fx</label>
      <input id="fx" autocomplete="off" spellcheck="false" />
    </div>

    <main id="grid-wrap">
      <canvas id="grid" tabindex="0" aria-label="Planilha"></canvas>
    </main>

    <footer>
      <span id="status" role="status">Pronto</span>
    </footer>
  </body>
</html>
