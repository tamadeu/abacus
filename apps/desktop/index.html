<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Abacus</title>
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <header class="titlebar">
      <div class="logo" aria-hidden="true">Á</div>
      <div class="doc">
        <h1 id="doc-name">Sem título</h1>
        <p id="doc-state"></p>
      </div>
      <div class="actions" id="file-actions">
        <button type="button" id="open-btn">Abrir</button>
        <button type="button" id="save-btn">Salvar</button>
        <button type="button" id="save-as-btn">Salvar como</button>
      </div>
    </header>

    <div id="toolbar">
    <div class="tabs" role="tablist" aria-label="Faixa de opções">
      <button type="button" role="tab" id="tab-home" data-tab="home" aria-controls="panel-home" aria-selected="true">Página Inicial</button>
      <button type="button" role="tab" id="tab-insert" data-tab="insert" aria-controls="panel-insert" aria-selected="false" tabindex="-1">Inserir</button>
      <button type="button" role="tab" id="tab-data" data-tab="data" aria-controls="panel-data" aria-selected="false" tabindex="-1">Dados</button>
      <button type="button" role="tab" id="tab-view" data-tab="view" aria-controls="panel-view" aria-selected="false" tabindex="-1">Exibir</button>
    </div>
    <div class="toolbar" id="panel-home" role="tabpanel" aria-labelledby="tab-home">
      <button type="button" data-action="cut" title="Recortar (Ctrl+X)">Recortar</button>
      <button type="button" data-action="copy" title="Copiar (Ctrl+C)">Copiar</button>
      <button type="button" data-action="paste" title="Colar (Ctrl+V)">Colar</button>
      <span class="separator" aria-hidden="true"></span>
      <button type="button" data-toggle="bold" aria-label="Negrito" title="Negrito (Ctrl+B)"><b>N</b></button>
      <button type="button" data-toggle="italic" aria-label="Itálico" title="Itálico (Ctrl+I)"><i>I</i></button>
      <button type="button" data-toggle="underline" aria-label="Sublinhado" title="Sublinhado (Ctrl+U)"><u>S</u></button>
      <button type="button" data-toggle="strike" aria-label="Tachado" title="Tachado"><s>ab</s></button>
      <button type="button" data-size="-1" aria-label="Diminuir a fonte" title="Diminuir a fonte">A−</button>
      <button type="button" data-size="1" aria-label="Aumentar a fonte" title="Aumentar a fonte">A+</button>
      <span class="separator" aria-hidden="true"></span>
      <label class="swatch" title="Cor do texto">
        Texto
        <input type="color" id="text-color" aria-label="Cor do texto" />
      </label>
      <label class="swatch" title="Cor de fundo">
        Fundo
        <input type="color" id="fill-color" aria-label="Cor de fundo" />
      </label>
      <button type="button" id="no-fill" aria-label="Remover a cor de fundo" title="Remover a cor de fundo">✕</button>
      <span class="separator" aria-hidden="true"></span>
      <button type="button" data-align="left" aria-label="Alinhar à esquerda" title="Alinhar à esquerda">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h14" /></svg>
      </button>
      <button type="button" data-align="center" aria-label="Centralizar" title="Centralizar">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M5 18h14" /></svg>
      </button>
      <button type="button" data-align="right" aria-label="Alinhar à direita" title="Alinhar à direita">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M10 12h10M6 18h14" /></svg>
      </button>
      <select id="valign" aria-label="Alinhamento vertical" title="Alinhamento vertical">
        <option value="" selected>Vertical</option>
        <option value="top">Em cima</option>
        <option value="center">No meio</option>
        <option value="bottom">Embaixo</option>
      </select>
      <button type="button" data-toggle="wrap" title="Quebrar o texto dentro da célula">Quebrar</button>
      <button type="button" id="merge-btn" title="Mesclar e centralizar; clique de novo para desfazer">Mesclar</button>
      <select id="borders" aria-label="Bordas" title="Bordas">
        <option value="" selected>Bordas</option>
        <option value="all">Todas</option>
        <option value="outer">Contorno</option>
        <option value="top">Superior</option>
        <option value="bottom">Inferior</option>
        <option value="left">Esquerda</option>
        <option value="right">Direita</option>
        <option value="none">Nenhuma</option>
      </select>
      <span class="separator" aria-hidden="true"></span>
      <button type="button" data-format="general" title="Formato geral">Geral</button>
      <button type="button" data-format="#,##0.00" title="Número com duas casas">0,00</button>
      <button type="button" data-format='"R$" #,##0.00' title="Moeda">R$</button>
      <button type="button" data-format="0.00%" title="Porcentagem">%</button>
    </div>

    <div class="toolbar" id="panel-insert" role="tabpanel" aria-labelledby="tab-insert" hidden>
      <button type="button" data-action="insert-row-above">Linha acima</button>
      <button type="button" data-action="insert-row-below">Linha abaixo</button>
      <button type="button" data-action="delete-rows">Excluir linhas</button>
      <span class="separator" aria-hidden="true"></span>
      <button type="button" data-action="insert-col-left">Coluna à esquerda</button>
      <button type="button" data-action="insert-col-right">Coluna à direita</button>
      <button type="button" data-action="delete-cols">Excluir colunas</button>
      <span class="separator" aria-hidden="true"></span>
      <button type="button" data-action="pivot-new" title="Resumir os dados da seleção (ou da tabela em volta da célula ativa) numa tabela dinâmica">Tabela dinâmica</button>
      <span class="separator" aria-hidden="true"></span>
      <span class="toolbar-label">Gráfico</span>
      <button type="button" data-action="chart-column" title="Gráfico de colunas com a seleção (ou a tabela em volta da célula ativa)">Colunas</button>
      <button type="button" data-action="chart-bar" title="Gráfico de barras">Barras</button>
      <button type="button" data-action="chart-line" title="Gráfico de linhas">Linhas</button>
      <button type="button" data-action="chart-area" title="Gráfico de área">Área</button>
      <button type="button" data-action="chart-pie" title="Gráfico de pizza">Pizza</button>
      <button type="button" data-action="chart-donut" title="Gráfico de rosca">Rosca</button>
      <button type="button" data-action="chart-scatter" title="Gráfico de dispersão (a primeira coluna é o X)">Dispersão</button>
    </div>

    <div class="toolbar" id="panel-data" role="tabpanel" aria-labelledby="tab-data" hidden>
      <button type="button" data-action="sort-asc" title="Classificar pela coluna da célula ativa, de A a Z">Classificar A→Z</button>
      <button type="button" data-action="sort-desc" title="Classificar pela coluna da célula ativa, de Z a A">Classificar Z→A</button>
      <span class="separator" aria-hidden="true"></span>
      <button type="button" data-action="filter" title="Escolher os valores a mostrar na coluna da célula ativa">Filtrar</button>
      <button type="button" data-action="clear-filter" title="Reexibir as linhas da tabela">Limpar filtro</button>
      <span class="separator" aria-hidden="true"></span>
      <button type="button" data-action="pivot-new" title="Resumir os dados da seleção numa tabela dinâmica">Tabela dinâmica</button>
      <button type="button" data-action="pivot-refresh" title="Atualizar todas as tabelas dinâmicas com os dados de origem">Atualizar tabelas</button>
      <button type="button" data-action="dv-open" title="Limitar o que pode ser digitado: lista suspensa, números, tamanho do texto">Validação de dados</button>
      <button type="button" data-action="cond-open" title="Pintar células segundo regras: maior que, duplicados, escala de cor, barras de dados…">Formatação condicional</button>
      <span class="separator" aria-hidden="true"></span>
      <button type="button" id="find-btn" title="Localizar (Ctrl+F)">Localizar</button>
      <button type="button" id="replace-btn" title="Localizar e substituir (Ctrl+H)">Substituir</button>
    </div>

    <div class="toolbar" id="panel-view" role="tabpanel" aria-labelledby="tab-view" hidden>
      <button type="button" data-action="freeze" title="Congelar as linhas acima e as colunas à esquerda da célula ativa">Congelar painéis</button>
      <button type="button" data-action="unfreeze">Descongelar</button>
      <span class="separator" aria-hidden="true"></span>
      <button type="button" data-action="hide-rows">Ocultar linhas</button>
      <button type="button" data-action="show-rows">Reexibir linhas</button>
      <span class="separator" aria-hidden="true"></span>
      <button type="button" data-action="hide-cols">Ocultar colunas</button>
      <button type="button" data-action="show-cols">Reexibir colunas</button>
    </div>
    </div>

    <div class="formula-bar">
      <div id="name-box" aria-label="Célula selecionada">A1</div>
      <label for="fx">fx</label>
      <input id="fx" autocomplete="off" spellcheck="false" />
    </div>

    <div id="workspace">
    <main id="grid-wrap">
      <canvas id="grid" tabindex="0" aria-label="Planilha"></canvas>
      <input id="cell-editor" hidden autocomplete="off" spellcheck="false" aria-label="Conteúdo da célula" />
      <div id="find" role="search" aria-label="Localizar e substituir" hidden>
        <div class="find-row">
          <input id="find-query" placeholder="Localizar" aria-label="Localizar" autocomplete="off" spellcheck="false" />
          <span id="find-count" role="status"></span>
          <button type="button" id="find-prev" aria-label="Anterior" title="Anterior (Shift+Enter)">↑</button>
          <button type="button" id="find-next" aria-label="Próxima" title="Próxima (Enter)">↓</button>
          <button type="button" id="find-close" aria-label="Fechar" title="Fechar (Esc)">×</button>
        </div>
        <div class="find-row">
          <input id="replace-text" placeholder="Substituir por" aria-label="Substituir por" autocomplete="off" spellcheck="false" />
          <button type="button" id="replace-one">Substituir</button>
          <button type="button" id="replace-all">Substituir tudo</button>
        </div>
      </div>
    </main>
    <aside id="pivot-panel" aria-label="Campos da tabela dinâmica" hidden></aside>
    </div>
    <ul id="pivot-menu" role="menu" hidden></ul>

    <div id="menu" role="menu" aria-label="Ações da seleção" hidden>
      <button type="button" role="menuitem" data-action="cut">Recortar</button>
      <button type="button" role="menuitem" data-action="copy">Copiar</button>
      <button type="button" role="menuitem" data-action="paste">Colar</button>
      <hr />
      <button type="button" role="menuitem" data-scope="row" data-action="insert-row-above">Inserir linha acima</button>
      <button type="button" role="menuitem" data-scope="row" data-action="insert-row-below">Inserir linha abaixo</button>
      <button type="button" role="menuitem" data-scope="row" data-action="delete-rows">Excluir linhas</button>
      <button type="button" role="menuitem" data-scope="row" data-tables data-action="hide-rows">Ocultar linhas</button>
      <button type="button" role="menuitem" data-scope="row" data-tables data-action="show-rows">Reexibir linhas</button>
      <hr data-scope="row" />
      <button type="button" role="menuitem" data-scope="col" data-action="insert-col-left">Inserir coluna à esquerda</button>
      <button type="button" role="menuitem" data-scope="col" data-action="insert-col-right">Inserir coluna à direita</button>
      <button type="button" role="menuitem" data-scope="col" data-action="delete-cols">Excluir colunas</button>
      <button type="button" role="menuitem" data-scope="col" data-tables data-action="hide-cols">Ocultar colunas</button>
      <button type="button" role="menuitem" data-scope="col" data-tables data-action="show-cols">Reexibir colunas</button>
    </div>

    <div id="filter" role="dialog" aria-labelledby="filter-title" hidden>
      <strong id="filter-title"></strong>
      <div id="filter-values"></div>
      <div class="filter-actions">
        <button type="button" id="filter-all">Marcar tudo</button>
        <button type="button" id="filter-cancel">Cancelar</button>
        <button type="button" id="filter-apply" class="primary">Aplicar</button>
      </div>
    </div>

    <div id="chart-panel" role="dialog" aria-label="Opções do gráfico" hidden>
      <strong>Gráfico</strong>
      <label>Título <input id="chart-title" type="text" autocomplete="off" /></label>
      <label>
        Tipo
        <select id="chart-kind">
          <option value="column">Colunas</option>
          <option value="bar">Barras</option>
          <option value="line">Linhas</option>
          <option value="area">Área</option>
          <option value="pie">Pizza</option>
          <option value="donut">Rosca</option>
          <option value="scatter">Dispersão</option>
        </select>
      </label>
      <label>Dados <input id="chart-range" type="text" autocomplete="off" placeholder="A1:C5" /></label>
      <div class="chart-row">
        <label>
          Empilhar
          <select id="chart-stacking">
            <option value="none">Não</option>
            <option value="stacked">Empilhado</option>
            <option value="percent">100%</option>
          </select>
        </label>
        <label>
          Legenda
          <select id="chart-legend">
            <option value="auto">Automática</option>
            <option value="none">Nenhuma</option>
            <option value="bottom">Embaixo</option>
            <option value="top">Em cima</option>
            <option value="right">À direita</option>
            <option value="left">À esquerda</option>
          </select>
        </label>
      </div>
      <div class="chart-checks">
        <label class="check"><input type="checkbox" id="chart-labels" /> Rótulos de dados</label>
        <label class="check"><input type="checkbox" id="chart-grid" /> Linhas de grade</label>
        <label class="check"><input type="checkbox" id="chart-smooth" /> Linhas suaves</label>
      </div>
      <div class="chart-row" id="chart-axes">
        <label>Título do eixo X <input id="chart-xtitle" type="text" autocomplete="off" /></label>
        <label>Título do eixo Y <input id="chart-ytitle" type="text" autocomplete="off" /></label>
        <label>Mínimo <input id="chart-ymin" type="text" inputmode="decimal" autocomplete="off" placeholder="auto" /></label>
        <label>Máximo <input id="chart-ymax" type="text" inputmode="decimal" autocomplete="off" placeholder="auto" /></label>
      </div>
      <fieldset id="chart-series-box">
        <legend>Séries</legend>
        <div id="chart-series"></div>
      </fieldset>
      <p id="chart-error" role="alert" hidden></p>
      <div class="filter-actions">
        <button type="button" id="chart-image">Exportar imagem</button>
        <button type="button" id="chart-delete">Excluir</button>
        <button type="button" id="chart-close" class="primary">Fechar</button>
      </div>
    </div>

    <div id="cond-panel" role="dialog" aria-labelledby="cond-title" hidden>
      <strong id="cond-title">Formatação condicional</strong>
      <ul id="cond-list"></ul>
      <fieldset>
        <legend id="cond-form-title">Nova regra</legend>
        <label>Células <input id="cond-range" type="text" autocomplete="off" placeholder="A1:B5" /></label>
        <label>
          Regra
          <select id="cond-kind"></select>
        </label>
        <div class="cond-values">
          <input id="cond-value" type="text" autocomplete="off" />
          <input id="cond-value2" type="text" autocomplete="off" />
        </div>
        <div class="cond-colors">
          <label data-cond-look="format scale"><span id="cond-color-label">Texto</span><input id="cond-color" type="color" /></label>
          <label data-cond-look="scale"><span><input id="cond-use-mid" type="checkbox" /> Meio</span><input id="cond-mid" type="color" /></label>
          <label><span id="cond-fill-label">Fundo</span><input id="cond-fill" type="color" /></label>
          <label data-cond-look="format" class="cond-bold"><input id="cond-bold" type="checkbox" /> Negrito</label>
        </div>
        <p id="cond-error" role="alert" hidden></p>
        <div class="filter-actions">
          <button type="button" id="cond-cancel" hidden>Cancelar edição</button>
          <button type="button" id="cond-save" class="primary">Adicionar regra</button>
        </div>
      </fieldset>
      <div class="filter-actions"><button type="button" id="cond-close">Fechar</button></div>
    </div>

    <div id="dv-panel" role="dialog" aria-labelledby="dv-title" hidden>
      <strong id="dv-title">Validação de dados</strong>
      <ul id="dv-list"></ul>
      <fieldset>
        <legend id="dv-form-title">Nova regra</legend>
        <label>Células <input id="dv-range" type="text" autocomplete="off" placeholder="A1:B5" /></label>
        <label>
          Permitir
          <select id="dv-kind">
            <option value="list">Lista</option>
            <option value="whole">Número inteiro</option>
            <option value="decimal">Número decimal</option>
            <option value="textLength">Tamanho do texto</option>
          </select>
        </label>
        <label id="dv-op-label">
          Condição
          <select id="dv-op">
            <option value="between">entre</option>
            <option value="notBetween">fora do intervalo</option>
            <option value="equal">igual a</option>
            <option value="notEqual">diferente de</option>
            <option value="greater">maior que</option>
            <option value="greaterEqual">maior ou igual a</option>
            <option value="less">menor que</option>
            <option value="lessEqual">menor ou igual a</option>
          </select>
        </label>
        <div class="cond-values">
          <input id="dv-value" type="text" autocomplete="off" />
          <input id="dv-value2" type="text" autocomplete="off" />
        </div>
        <label>Aviso ao recusar (opcional) <input id="dv-message" type="text" autocomplete="off" /></label>
        <p id="dv-error" role="alert" hidden></p>
        <div class="filter-actions">
          <button type="button" id="dv-cancel" hidden>Cancelar edição</button>
          <button type="button" id="dv-save" class="primary">Adicionar regra</button>
        </div>
      </fieldset>
      <div class="filter-actions"><button type="button" id="dv-close">Fechar</button></div>
    </div>

    <ul id="dv-menu" role="listbox" aria-label="Valores permitidos" hidden></ul>

    <div id="fn-hint" role="status" hidden></div>
    <ul id="suggest" role="listbox" aria-label="Funções" hidden></ul>

    <footer>
      <div id="sheet-tabs" role="tablist" aria-label="Planilhas"></div>
      <button type="button" id="add-sheet" aria-label="Nova planilha" title="Nova planilha">+</button>
      <span id="stats" aria-label="Resumo da seleção"></span>
      <span id="status" role="status">Pronto</span>
      <span id="zoom-box"><input id="zoom" type="range" min="50" max="300" step="10" value="100" aria-label="Zoom" /><span id="zoom-label" title="Dois cliques voltam a 100%">100%</span></span>
    </footer>
  </body>
</html>
