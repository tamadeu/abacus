[package]
name = "abacus-desktop"
description = "Abacus para desktop"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[lib]
# O sufixo `_lib` evita conflito entre o nome da biblioteca e o do binário
# no Windows: https://github.com/rust-lang/cargo/issues/8519
name = "abacus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Fork do IronCalc: português do Brasil (localidade e idioma) e agrupamento
# de alterações num único passo de desfazer.
ironcalc = { git = "https://github.com/tamadeu/IronCalc", branch = "abacus" }
abacus-doc = { path = "../../../crates/abacus-doc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.42"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
