[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "crates/abacus-doc"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/tamadeu/abacus"
license = "MIT"

# Perfil de release recomendado pelo Tauri: https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
